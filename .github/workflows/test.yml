name: Foundation checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.9'
      - run: uv sync --locked --python '${{ matrix.python }}' --extra google --extra browser
      - run: uv run --locked --extra google --extra browser pytest -q -rs
      - run: uv build --wheel
      - name: Smoke-test installed wheel outside the checkout
        shell: python
        run: |
          import json, os, pathlib, subprocess, tempfile, venv
          wheel = next(pathlib.Path("dist").resolve().glob("*.whl"))
          with tempfile.TemporaryDirectory() as scratch:
              env = pathlib.Path(scratch) / "SEO محیط"
              venv.create(env, with_pip=True)
              bin_dir = env / ("Scripts" if os.name == "nt" else "bin")
              python = bin_dir / ("python.exe" if os.name == "nt" else "python")
              cli = bin_dir / ("seo-analysis.exe" if os.name == "nt" else "seo-analysis")
              fixture = pathlib.Path(scratch) / "build"
              fixture.mkdir()
              (fixture / "index.html").write_text("<title>Fixture</title><main>نمونه</main>", encoding="utf-8")
              config = pathlib.Path(scratch) / "config.toml"
              config.write_text('[paths]\ndata_dir="data"\n', encoding="utf-8")
              for args in ([python, "-m", "pip", "install", wheel], [cli, "--help"],
                           [cli, "--config-file", config, "system", "doctor", "--json"],
                           [python, "-c", "from seo_analysis.analysis.fa_text import load_stopwords; assert load_stopwords()"]):
                  subprocess.run(args, cwd=scratch, check=True)
              result = subprocess.check_output(
                  [cli, "--config-file", config, "site-qa", fixture, "--json"], cwd=scratch, encoding="utf-8"
              )
              run = json.loads(result)
              assert run["status"] == "succeeded" and run["counts"]["pages"] == 1
              assert (pathlib.Path(run["out_dir"]) / "site-qa.json").is_file()
      - name: Upload verified wheel
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v5
        with:
          name: seo-analysis-wheel
          path: dist/*.whl
          if-no-files-found: error
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.9'
      - run: uv sync --locked --group quality
      - run: uv run --locked --group quality ruff check src tests
      - run: uv run --locked --group quality mypy src/seo_analysis
      - run: uv run --locked --group quality bandit -q -ll -r src
      - name: Audit locked runtime dependencies
        run: |
          uv export --locked --no-dev --all-extras --no-emit-project --output-file /tmp/seo-requirements.txt
          uv run --locked --group quality pip-audit --disable-pip --require-hashes -r /tmp/seo-requirements.txt
