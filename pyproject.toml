[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "seo-analysis"
version = "0.3.0"
description = "Local-first SEO analysis and website research tools"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "jinja2>=3.1,<4",
    "pillow>=11,<14",
    "openpyxl>=3.1,<4",
    "defusedxml>=0.7,<1",
    "mcp>=1.12,<2",
    "filelock>=3.18,<4",
    "idna>=3,<4",
    "urllib3>=2.6,<3",
    "platformdirs>=4,<5",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
google = ["google-auth-oauthlib>=1.5,<2", "keyring>=25,<26"]
research = ["keyring>=25,<26"]
wordpress = ["keyring>=25,<26"]
browser = ["playwright>=1.48,<2"]

[project.scripts]
seo-analysis = "seo_analysis.cli:main"

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/seo_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
