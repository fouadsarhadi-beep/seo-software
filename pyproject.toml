[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "seo-analysis"
version = "0.1.0"
description = "Local-first SEO analysis and website research tools"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "platformdirs>=4,<5",
    "requests>=2.32,<3",
]

[project.scripts]
seo-analysis = "seo_analysis.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/seo_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
